<h2>Course List</h2>

<p *ngIf="isLoading">
  Loading courses...
</p>

<div *ngIf="!isLoading">

  <app-course-card
    *ngFor="let course of courses; trackBy: trackByCourseId"
    [course]="course"
    (enrollRequested)="onEnroll($event)">
  </app-course-card>

</div>

<p *ngIf="selectedCourseId">
  <strong>Selected Course ID:</strong> {{ selectedCourseId }}
</p>

<p *ngIf="notificationService.getMessage()">
  <strong>{{ notificationService.getMessage() }}</strong>
</p>
