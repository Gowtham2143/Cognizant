<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <div>
    <label>Student Name</label><br>
    <input type="text" formControlName="studentName">

    <div *ngIf="f['studentName'].touched && f['studentName'].errors?.['required']">
      Name is required
    </div>

    <div *ngIf="f['studentName'].touched && f['studentName'].errors?.['minlength']">
      Name must be at least 3 characters
    </div>
  </div>

  <br>

  <div>
    <label>Email</label><br>
    <input type="email" formControlName="studentEmail">

    <div *ngIf="f['studentEmail'].touched && f['studentEmail'].errors?.['required']">
      Email is required
    </div>

    <div *ngIf="f['studentEmail'].touched && f['studentEmail'].errors?.['email']">
      Enter a valid email
    </div>
  </div>

  <br>

  <div>
    <label>Course ID</label><br>
    <input type="number" formControlName="courseId">

    <div *ngIf="f['courseId'].touched && f['courseId'].errors?.['required']">
      Course ID is required
    </div>
  </div>

  <br>

  <div>
    <label>Preferred Semester</label><br>
    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <br>

  <div>
    <input type="checkbox" formControlName="agreeToTerms">
    <label>I agree to the Terms and Conditions</label>

    <div *ngIf="f['agreeToTerms'].touched && f['agreeToTerms'].errors?.['required']">
      You must agree to the terms.
    </div>
  </div>

  <br>

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

  <button type="button" (click)="enrollForm.reset()">
    Reset
  </button>

</form>

<br>

<div *ngIf="submitted">
  Enrollment request submitted successfully!
</div>
