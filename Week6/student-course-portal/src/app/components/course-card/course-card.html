<div
  class="course-card"
  [ngClass]="cardClasses"
  appHighlight="lightblue"
  style="border:1px solid black; padding:10px; margin:10px;">

  <h3>{{ course.name }}</h3>

  <p><strong>Course Code:</strong> {{ course.code }}</p>

  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>

  <p>
    <strong>Status:</strong>

    <span [ngSwitch]="course.gradeStatus">

      <span *ngSwitchCase="'Passed'">Passed ✅</span>

      <span *ngSwitchCase="'Failed'">Failed ❌</span>

      <span *ngSwitchDefault>In Progress ⏳</span>

    </span>
  </p>

  <button (click)="enrollCourse()">
    Enroll
  </button>

  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

  <div *ngIf="isExpanded">

    <hr>

    <p><strong>Course ID:</strong> {{ course.id }}</p>

    <p><strong>Course Name:</strong> {{ course.name }}</p>

    <p><strong>Course Code:</strong> {{ course.code }}</p>

    <p><strong>Credits:</strong> {{ course.credits }}</p>

    <p><strong>Grade Status:</strong> {{ course.gradeStatus }}</p>

  </div>

</div>
